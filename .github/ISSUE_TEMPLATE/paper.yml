name: Paper intake
description: 收藏论文：仅标题和链接必填，先整理到 inbox；Register 后才分配 ID 和主笔记
title: "[Paper] "
labels:
  - "type: paper"
  - "status: inbox"
body:
  - type: input
    id: title
    attributes:
      label: 论文标题
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 原始来源
      description: 优先填写会议主页、出版社页面或 arXiv 链接。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 方向
      options:
        - Multi-Agent
        - Continual Learning
        - Metacognition
        - Cross-cutting
    validations:
      required: false
  - type: textarea
    id: reason
    attributes:
      label: 收藏理由 / 希望了解的内容
      description: 可选：为什么收藏，或希望了解什么？
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: 发现渠道
      placeholder: 导师推荐、引用链、会议列表等
